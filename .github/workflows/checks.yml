name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ruff==0.17.0 mypy==2.4.0
      - run: ruff check .
      - run: mypy
      - run: MYPYPATH=tools/cursor_cleanup mypy --strict tools/cursor_cleanup/lifecycle.py tools/cursor_cleanup/ledger.py tools/install_cursor_cleanup.py tools/install_shared_radar.py
      - run: python tools/check_architecture.py
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
  native-chat:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcrun swiftc -swift-version 6 -warnings-as-errors native/DoroChat/*.swift -o /tmp/doro-chat-check
      - run: xcrun swiftc -swift-version 6 -warnings-as-errors native/DoroChat/PetAnimation.swift tests/native/MotionChecks.swift -o /tmp/doro-motion-check
      - run: /tmp/doro-motion-check
      - run: xcrun swiftc -swift-version 6 -warnings-as-errors native/DoroChat/ChatModels.swift native/DoroChat/StackCatalog.swift tests/native/StackChecks.swift -o /tmp/doro-stack-check
      - run: /tmp/doro-stack-check
      - run: xcrun swiftc -swift-version 6 -warnings-as-errors native/DoroChat/ChatModels.swift native/DoroChat/ApprovalPresentation.swift tests/native/ApprovalChecks.swift -o /tmp/doro-approval-check
      - run: /tmp/doro-approval-check
      - run: xcrun swiftc -swift-version 6 -warnings-as-errors native/DoroChat/ChatModels.swift native/DoroChat/SubmissionLedger.swift tests/native/SubmissionChecks.swift -o /tmp/doro-submission-check
      - run: /tmp/doro-submission-check
      - run: xcrun swiftc -swift-version 6 -warnings-as-errors $(find native/DoroChat -name '*.swift' ! -name 'main.swift') tests/native/InteractionChecks.swift -o /tmp/doro-interaction-check
      - run: /tmp/doro-interaction-check
      - run: xcrun swiftc -swift-version 6 -warnings-as-errors $(find native/DoroChat -name '*.swift' ! -name 'main.swift') tests/native/HistoryChecks.swift -o /tmp/doro-history-check
      - run: /tmp/doro-history-check
      - run: xcrun swiftc -swift-version 6 -warnings-as-errors $(find native/DoroChat -name '*.swift' ! -name 'main.swift') tests/native/WindowControlChecks.swift -o /tmp/doro-window-control-check
      - run: /tmp/doro-window-control-check
      - run: xcrun swiftc -swift-version 6 -warnings-as-errors $(find native/DoroChat -name '*.swift' ! -name 'main.swift') tests/native/StateChecks.swift -o /tmp/doro-state-check
      - run: /tmp/doro-state-check
      - run: xcrun swiftc -swift-version 6 -warnings-as-errors $(find native/DoroChat -name '*.swift' ! -name 'main.swift') tests/native/BackgroundChecks.swift -o /tmp/doro-background-check
      - run: /tmp/doro-background-check
      - run: xcrun swiftc -swift-version 6 -warnings-as-errors native/DoroChat/ChatInputEditor.swift tests/native/ComposerChecks.swift -o /tmp/doro-composer-check
      - run: /tmp/doro-composer-check
      - run: xcrun swiftc -swift-version 6 -warnings-as-errors $(find native/DoroChat -name '*.swift' ! -name 'main.swift') tests/native/TaskListChecks.swift -o /tmp/doro-task-list-check
      - run: /tmp/doro-task-list-check
      - run: xcrun swiftc -swift-version 6 -warnings-as-errors $(find native/DoroChat -name '*.swift' ! -name 'main.swift') tests/native/PersistenceBoundaryChecks.swift -o /tmp/doro-persistence-boundary-check
      - run: /tmp/doro-persistence-boundary-check
      - run: xcrun swiftc -swift-version 6 -warnings-as-errors $(find native/DoroChat -name '*.swift' ! -name 'main.swift') tests/native/ResourceChecks.swift -o /tmp/doro-resource-check
      - run: /tmp/doro-resource-check
      - run: xcrun swiftc -swift-version 6 -warnings-as-errors native/DoroOpen/main.swift -o /tmp/doro-open-check
      - run: xcrun swiftc -swift-version 6 -warnings-as-errors tools/cursor_cleanup/inspector.swift -o /tmp/doro-cursor-inspector
